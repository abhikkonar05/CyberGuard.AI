version: '3.8'

services:
  # ----------------------------------------------------------------
  # 1. Apache ZooKeeper (Coordinates Kafka Broker)
  # ----------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cyberguard-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - cyber-network

  # ----------------------------------------------------------------
  # 2. Apache Kafka Broker
  # ----------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cyberguard-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - cyber-network

  # ----------------------------------------------------------------
  # 3. Django REST API Backend (Render-compatible Web Service)
  # ----------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfiles/Dockerfile.backend
    container_name: cyberguard-backend
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      PORT: "8000"
      DJANGO_SECRET_KEY: "cyberguard-docker-secret-key-production-use"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,frontend,0.0.0.0"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:80,http://127.0.0.1:5173"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_TOPIC: "network-traffic"
    volumes:
      - ./backend/data/predictions:/app/backend/data/predictions
      - ./backend/logs:/app/backend/logs
      - ./spark/models:/app/spark/models
    networks:
      - cyber-network

  # ----------------------------------------------------------------
  # 4. React + Vite Frontend (Nginx Production Server)
  # ----------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfiles/Dockerfile.frontend
    container_name: cyberguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - cyber-network

networks:
  cyber-network:
    driver: bridge

